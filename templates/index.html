<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-online {
            color: #28a745;
        }
        .status-offline {
            color: #dc3545;
        }
        .table-container {
            margin: 20px;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
        }
        .add-device-form {
            margin: 20px;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }
        .last-checked {
            font-size: 0.8em;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Network Monitoring Dashboard</h1>
        </div>
    </div>

    <div class="container">
        <div class="add-device-form">
            <h3>Add New Device</h3>
            <form id="addDeviceForm" class="row g-3">
                <div class="col-md-4">
                    <label for="deviceName" class="form-label">Device Name</label>
                    <input type="text" class="form-control" id="deviceName" required>
                </div>
                <div class="col-md-4">
                    <label for="deviceIP" class="form-label">IP Address</label>
                    <input type="text" class="form-control" id="deviceIP" required>
                </div>
                <div class="col-md-4">
                    <label for="deviceType" class="form-label">Device Type</label>
                    <select class="form-select" id="deviceType" required>
                        <option value="router">Router</option>
                        <option value="server">Server</option>
                        <option value="printer">Printer</option>
                        <option value="computer">Computer</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Add Device</button>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Device Name</th>
                        <th>Type</th>
                        <th>IP Address</th>
                        <th>Status</th>
                        <th>Last Checked</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="deviceTable">
                    {% for device in devices %}
                    <tr>
                        <td>{{ device.name }}</td>
                        <td>{{ device.type }}</td>
                        <td>{{ device.ip }}</td>
                        <td class="status-{{ device.status|lower }}">{{ device.status }}</td>
                        <td class="last-checked">{{ device.last_checked }}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteDevice('{{ device.ip }}')">Delete</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function updateTable() {
            fetch('/api/status')
                .then(response => response.json())
                .then(devices => {
                    const tableBody = document.getElementById('deviceTable');
                    tableBody.innerHTML = '';
                    
                    devices.forEach(device => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${device.name}</td>
                            <td>${device.type}</td>
                            <td>${device.ip}</td>
                            <td class="status-${device.status.toLowerCase()}">${device.status}</td>
                            <td class="last-checked">${device.last_checked}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteDevice('${device.ip}')">Delete</button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                });
        }

        function deleteDevice(ip) {
            fetch('/api/delete_device', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ ip: ip })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateTable();
                }
            });
        }

        document.getElementById('addDeviceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const deviceData = {
                name: document.getElementById('deviceName').value,
                ip: document.getElementById('deviceIP').value,
                type: document.getElementById('deviceType').value,
                status: 'Checking...',
                last_checked: new Date().toLocaleString()
            };

            fetch('/api/add_device', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(deviceData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('addDeviceForm').reset();
                    updateTable();
                }
            });
        });

        // Update table every 30 seconds
        setInterval(updateTable, 30000);
        
        // Initial update
        updateTable();
    </script>
</body>
</html>
